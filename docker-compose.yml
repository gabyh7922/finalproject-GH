services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lexlaboral
      POSTGRES_USER: lexlaboral
      POSTGRES_PASSWORD: lexlaboral
    ports:
      - "5434:5432"   # 5432/5433 quedan libres para otros proyectos locales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexlaboral -d lexlaboral"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
