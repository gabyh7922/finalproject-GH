[project]
name = "lexlaboral"
version = "0.1.0"
description = "Asistente de IA sobre el Código del Trabajo de Chile: CAG -> RAG híbrido con citas verificables -> agente, con evals y despliegue."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "tiktoken>=0.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
eval = [
    "datasets==5.0.1",
    "langchain==0.3.30",
    "langchain-community==0.3.21",
    "langchain-core==0.3.86",
    "langchain-openai==0.3.35",
    "ragas==0.2.15",
]
rerank = [
    "numpy<2",
    "sentence-transformers<4",
    "torch==2.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
